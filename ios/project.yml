# XcodeGen spec — run `xcodegen generate` in this directory to produce GoControl.xcodeproj.
# See README.md for the no-tools alternative.
name: GoControl

options:
  bundleIdPrefix: com.gocontrol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GoControl:
    type: application
    platform: iOS
    sources:
      - path: GoControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gocontrol.app
        PRODUCT_NAME: GoControl
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only, matching the Android layout
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Open_360GO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Required, or CBCentralManager init traps the moment the app launches.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          GoControl uses Bluetooth to find and control your Insta360 GO camera.
